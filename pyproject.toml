[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchforge"
version = "0.1.0"
description = "PatchForge platform: GitHub App auth, sandboxed test runs, job pipeline and live event stream"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.8",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["patchforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
